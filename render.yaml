services:
  - type: web
    name: finhealth-api
    runtime: python
    buildCommand: pip install -r backend/requirements.txt
    startCommand: cd backend && uvicorn main:app --host 0.0.0.0 --port $PORT
    rootDir: .
    envVars:
      - key: PYTHONPATH
        value: .
      - key: OPENAI_API_KEY
        sync: false   # Set this manually in Render dashboard
      - key: ALLOWED_ORIGINS
        value: "*"
    healthCheckPath: /health
    plan: free
