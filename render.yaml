services:
  - type: web
    name: company-financial-health-calculator
    runtime: docker
    dockerfilePath: ./Dockerfile
    envVars:
      - key: PYTHONPATH
        value: /app
      - key: OPENAI_API_KEY
        sync: false        # Add this manually in Render dashboard
      - key: ALLOWED_ORIGINS
        value: "*"
    healthCheckPath: /health
    plan: free
